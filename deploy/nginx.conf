# HA-PORTALS Nginx location 块
# 本文件是 include snippet，不能直接放到 conf.d/ 中
#
# 安装方式：
#   sudo cp deploy/nginx.conf /etc/nginx/snippets/ha-portals.conf
#   然后在已有 server 块（如 psy-cms.conf）末尾添加：
#     include /etc/nginx/snippets/ha-portals.conf;
#   最后 sudo nginx -t && sudo systemctl reload nginx

# HA-PORTALS 前端静态文件
location /ha/ {
    alias /home/admin/WorkSpace/project/HA-PORTALS/frontend/dist/;
    try_files $uri $uri/ /ha/index.html;
    # 安全头（零成本）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# HA-PORTALS API 反向代理
location /ha/api/ {
    proxy_pass http://127.0.0.1:8002/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
}

# HA-PORTALS 上传文件
location /ha/uploads/ {
    alias /home/admin/WorkSpace/project/HA-PORTALS/backend/uploads/;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}
